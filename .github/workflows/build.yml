name: Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate UUID
        run: |
          UUID="sdk-node-$(head -c 1024 /dev/urandom | md5sum | tr -d ' -')"
          sed -i "s/sdk-node-[a-f0-9]*/$UUID/" Dockerfile

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/socks7-v2rei/orchid-bloom:latest
